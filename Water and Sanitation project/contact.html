<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Water for All for any inquiries about our projects, volunteering, or donations.">
    <title>&#xF30D;Water for All | Contact Us</title>
    <link rel="stylesheet" href="contact-stlyes.css"> 
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Contact Us</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="get-involved.html" class="nav-link">Get Involved</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Contact Form Section -->
        <section class="section form-section">
            <h2>Send Us a Message</h2>
            <form action="submit-form.php" method="post" class="contact-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
                
                <button type="submit" class="btn">Submit</button>
            </form>
        </section>

        <!-- Additional Contact Information -->
        <section class="section contact-info">
            <h2>Our Contact Information</h2>
            <p><strong>Email:</strong> contact@waterforall.org</p>
            <p><strong>Phone:</strong> +256 7514 59337</p>
            <p><strong>Address:</strong> Plot 21 A, Port Bell Rd, Kampala</p>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Water for All | <a href="index.html" class="footer-link">Home</a></p>
    </footer>
